# Ergaenzungen fuer /etc/nginx/sites-enabled/mixapart.de — in den server-Block,
# oberhalb des bestehenden Asset-Blocks (regex-locations greifen der Reihe nach).
#
# nginx' mime.types kennt .mjs nicht und faellt auf default_type zurueck,
# also application/octet-stream. Modul-Scripts lehnt der Browser dann ab:
#   "Expected a JavaScript-or-Wasm module script but the server responded
#    with a MIME type of application/octet-stream"
# Die Folge hier: ort.webgpu.bundle.min.mjs laedt nicht, und ohne Runtime
# bietet die Oberflaeche keine Hardware-Auswahl an.
#
# types { } leert die Typtabelle nur innerhalb dieses Blocks, danach greift
# default_type. Ein types-Block im server-Kontext wuerde dagegen die gesamte
# geerbte Tabelle ersetzen — deshalb die enge location.

location ~* \.mjs$ {
    types { }
    default_type text/javascript;
    expires 7d;
}

# Gilt hier nur vorsorglich: die Runtime liegt als .wasm.000/.001 vor und wird
# per fetch geladen, nicht gestreamt. Eine echte .wasm braeuchte diesen Typ.
location ~* \.wasm$ {
    types { }
    default_type application/wasm;
    expires 7d;
}

# ---------------------------------------------------------------- Cache
#
# Die Dateien des Angular-Builds tragen ihren Inhalt im Namen
# (`outputHashing: all`): main-KDPPNZK4.js heisst nur so lange so, wie sie
# Byte fuer Byte dieselbe ist. Aendert sich etwas, aendert sich der Name,
# und die neue index.html zeigt auf den neuen. Eine solche Datei darf
# liegen bleiben, bis der Browser von selbst aufraeumt — nachfragen muss er
# nie.
#
# Bisher galten dafuer dieselben 7 Tage wie fuer alles andere; Lighthouse
# hat das unter „Effiziente Verweildauer im Cache" angestrichen. Ein Jahr
# ist das Hoechste, was die Spezifikation vorsieht, `immutable` spart
# zusaetzlich die Rueckfrage beim Neuladen der Seite.
#
# Zwei Fallen stecken darin:
#
#   `expires off` muss sein, nicht weil hier etwas abgeschaltet wuerde,
#   sondern weil ein geerbtes `expires` aus dem server-Block sonst seine
#   eigene Cache-Control-Zeile danebensetzt — zwei widersprechende
#   Kopfzeilen, und welche gilt, entscheidet der Browser.
#
#   Das include der Sicherheitskopfzeilen steht hier noch einmal, weil
#   `add_header` in einer location alle geerbten add_header-Zeilen ersetzt.
#   Ohne diese Zeile kaeme ausgerechnet das Hauptbuendel ohne CSP heraus.
#   (Stand heute setzt der Server die Kopfzeilen ueberhaupt nicht —
#   `curl -I https://mixapart.de/` liefert keine. Das include fehlt
#   offenbar noch im server-Block.)
#
# Diese location muss **vor** dem allgemeinen Asset-Block stehen:
# regex-locations greifen in der Reihenfolge, in der sie dastehen.
location ~* ^/(main|chunk|worker|styles|polyfills|scripts)-[A-Za-z0-9_-]+\.(?:js|css|mjs)$ {
    expires off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/mixapart-security-headers.conf;
    try_files $uri =404;
}

# Die Zeichen der Marke tragen keinen Hash im Namen — ein Jahr waere hier
# falsch, denn eine geaenderte app-icon.svg erschiene erst im naechsten
# Jahr. 30 Tage sind der Kompromiss: lange genug, dass kein Wiederbesuch
# sie erneut holt, kurz genug, dass eine Aenderung ankommt.
# Nur `expires`, kein eigenes Cache-Control: die Direktive schreibt diese
# Kopfzeile selbst, und beides nebeneinander ergaebe sie zweimal.
location ~* ^/(app-icon|icon_no_bg|favicon)\.svg$ {
    expires 30d;
    include /etc/nginx/snippets/mixapart-security-headers.conf;
    try_files $uri =404;
}

# cloud.json sagt, ob es den Serverweg gibt und wohin er fuehrt. Sie traegt
# keinen Hash, wird zur Laufzeit gelesen und aendert sich genau dann, wenn
# jemand den Weg ein- oder ausschaltet — also in dem Moment, in dem die
# Aenderung sofort ankommen muss. Ein geerbtes `expires` aus dem
# server-Block wuerde genau das verzoegern: der Weg bliebe nach dem
# Eintragen des Tokens noch stundenlang unsichtbar, und niemand wuesste,
# ob es am Cache liegt oder am Token.
location = /cloud.json {
    expires off;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/mixapart-security-headers.conf;
    try_files $uri =404;
}

# Die index.html dagegen nie: sie ist das Verzeichnis, das auf die
# gehashten Namen zeigt. Liegt sie im Cache, bleibt der ganze Bau alt.
location = /index.html {
    expires off;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/mixapart-security-headers.conf;
}
