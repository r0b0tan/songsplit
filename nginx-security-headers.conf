# Sicherheitskopfzeilen fuer mixapart.de (nginx auf dem Zielserver).
#
# Einbinden im server-Block von /etc/nginx/sites-available/mixapart.de:
#
#     server {
#         ...
#         include /etc/nginx/snippets/mixapart-security-headers.conf;
#     }
#
# Danach `./deploy.sh --reload-nginx` (prueft mit `nginx -t` und laedt neu).
#
# ACHTUNG, nginx-Falle: `add_header` in einem location-Block ersetzt *alle*
# geerbten add_header-Zeilen des server-Blocks. Wo also eine location eigene
# Kopfzeilen setzt (typisch `Cache-Control` fuer /models/ oder /vendor/),
# muss dieses include dort **noch einmal** stehen, sonst liefert genau jener
# Pfad ohne Richtlinie aus. `always` sorgt dafuer, dass auch Fehlerseiten
# (404, 50x) die Kopfzeilen tragen.
#
# Auf Cloudflare Pages waere dasselbe eine Datei `_headers` im Wurzel der
# Auslieferung. Hier liegt die Seite auf nginx, und nginx liest die nicht.

# Die Seite laedt ausschliesslich von ihrer eigenen Herkunft: Oberflaeche,
# vendorierte ONNX-Runtime, ihr WASM und die Modellgewichte. Kein CDN, keine
# Fremdschrift, kein Zaehlpixel. Deshalb kann die Richtlinie so eng stehen —
# und deshalb faellt auf, wenn sich das einmal aendert.
#
# `blob:` in script-src ist kein Versehen und darf nicht weg: Signalsmith
# Stretch baut sein AudioWorklet, indem es eigenen Quelltext in eine
# Blob-URL schreibt (siehe den Kopf von frontend/src/app/audio/signalsmith.ts),
# und Worklet-Skripte fallen unter script-src, nicht unter worker-src. Ohne
# `blob:` laedt das Deck keine einzige Spur — und zwar lautlos: Chromium
# meldet Verstoesse aus einem Worklet weder in der Konsole noch an report-uri.
# Gegenprobe: `npm run test:public` mit gesetzter Kopfzeile; ohne `blob:`
# bleibt dort der Durchlauf haengen, mit `blob:` laeuft er wie ohne CSP.
#
# `'unsafe-inline'` steht nur bei style-src: Angular haengt die Styles der
# Komponenten als <style>-Block in die Seite. Bei script-src steht es
# ausdruecklich NICHT — damit das Inline-Skript des Critical-CSS-Inliners
# nicht durchkaeme, ist dieser im Build abgeschaltet (angular.json,
# `optimization.styles.inlineCritical: false`).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; frame-ancestors 'none'" always;

# Kein MIME-Raten: eine als Bild ausgelieferte Datei wird nicht als Skript
# ausgefuehrt, bloss weil ihr Inhalt danach aussieht.
add_header X-Content-Type-Options "nosniff" always;

# Beim Weg nach draussen nur die Herkunft nennen, nie den vollen Pfad.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Die Seite braucht weder Kamera noch Mikrofon noch Standort. Was sie nicht
# braucht, soll sie auch nicht anfordern koennen.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), serial=(), payment=()" always;

# Fremde Fenster bekommen keinen Griff auf dieses. Allein ergibt das noch
# kein `crossOriginIsolated` — dafuer braeuchte es zusaetzlich
# Cross-Origin-Embedder-Policy, und die Abwaegung dagegen steht in
# frontend/src/app/separate/runtime.ts.
add_header Cross-Origin-Opener-Policy "same-origin" always;
